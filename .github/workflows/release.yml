name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, os: linux, arch: arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, os: darwin, arch: amd64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --release
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked -p presign-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          name="presign_${GITHUB_REF_NAME#v}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/presign" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" -C "$name" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: "*.tar.gz"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            checksums.txt
          generate_release_notes: true
