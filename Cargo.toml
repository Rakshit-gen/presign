[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Rakshit-gen/presign"

[workspace.dependencies]
presign = { path = "crates/presign" }
alloy-dyn-abi = { version = "1.7.3", features = ["eip712"] }
alloy-primitives = "1.7.3"
alloy-sol-types = "1.7.3"
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
